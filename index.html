
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匿名星球</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3fb;color:#29263b;font-family:Arial,"Microsoft JhengHei",sans-serif}
header{background:white;padding:20px 7%;font-size:22px;font-weight:bold;color:#7658df;box-shadow:0 2px 10px #00000008}
main{max-width:950px;margin:45px auto;padding:0 18px}
h1{font-size:30px;margin-bottom:8px}
.sub{color:#888;margin-bottom:30px}
.layout{display:grid;grid-template-columns:330px 1fr;gap:20px}
.card{background:white;border-radius:18px;padding:25px;box-shadow:0 5px 25px #00000008}
h2{font-size:18px;margin-top:0}
label{display:block;font-size:14px;font-weight:bold;margin:20px 0 8px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px}
.options{display:flex;gap:8px}
.options button{flex:1;padding:11px 5px;border:1px solid #ddd;background:white;border-radius:9px}
.options button.active{border-color:#7658df;color:#7658df;background:#f2efff}
.primary{width:100%;padding:14px;border:0;border-radius:10px;background:#7658df;color:white;font-size:16px;font-weight:bold;margin-top:25px;cursor:pointer}
.primary:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:20px;padding:15px;background:#f5f3fb;border-radius:10px;color:#666;line-height:1.7}
.chat{min-height:400px;display:flex;flex-direction:column}
.chatbody{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:#888;line-height:2}
footer{text-align:center;color:#aaa;padding:30px;font-size:12px}
@media(max-width:700px){.layout{grid-template-columns:1fr}main{margin:25px auto}header{padding:18px}}
</style>
</head>
<body>
<header>✦ 匿名星球</header>
<main>
<h1>遇見一個陌生人</h1>
<p class="sub">不用真實姓名，從一段聊天開始認識彼此。</p>

<div class="layout">
<section class="card">
<h2>你的配對條件</h2>

<label>匿名暱稱</label>
<input id="nickname" maxlength="20" placeholder="輸入你的暱稱">

<label>你的性別</label>
<div class="options" id="gender">
<button data-value="male">男生</button>
<button data-value="female">女生</button>
<button data-value="other">其他</button>
</div>

<label>想認識的對象</label>
<div class="options" id="seeking">
<button data-value="male">男生</button>
<button data-value="female">女生</button>
<button class="active" data-value="any">不限</button>
</div>

<button class="primary" id="start" disabled>正在連接...</button>

<div class="status" id="status">
正在初始化匿名登入...
</div>
</section>

<section class="card chat">
<h2 id="roomTitle">聊天室</h2>
<div class="chatbody" id="chat">
<div>
<div style="font-size:48px">💬</div>
<strong>你的下一段故事，從這裡開始</strong>
<div>設定條件，尋找聊天夥伴。</div>
</div>
</div>
</section>
</div>
</main>

<footer>匿名星球 · 讓每一次相遇，都從聊天開始</footer>

<script>
const SUPABASE_URL = "https://rxeolvxuvhysvgwvnkmu.supabase.co";
const SUPABASE_KEY = "sb_publishable_JC0K_2qN8_GMv9qXFjxohQ_WGWwlPTM";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user = null;
let gender = "";
let seeking = "any";
let searching = false;
let timer = null;

const $ = id => document.getElementById(id);

function choose(container, callback) {
  $(container).querySelectorAll("button").forEach(button => {
    button.onclick = () => {
      $(container).querySelectorAll("button").forEach(b => b.classList.remove("active"));
      button.classList.add("active");
      callback(button.dataset.value);
    };
  });
}

choose("gender", value => gender = value);
choose("seeking", value => seeking = value);

function message(title, detail) {
  $("chat").innerHTML = "";

  const div = document.createElement("div");
  div.style.textAlign = "center";
  div.style.margin = "auto";

  const strong = document.createElement("strong");
  strong.textContent = title;

  const p = document.createElement("p");
  p.textContent = detail;

  div.append(strong, p);
  $("chat").appendChild(div);
}

async function initialize() {
  try {
    const {data, error} = await db.auth.getSession();
    if (error) throw error;

    if (data.session) {
      user = data.session.user;
    } else {
      const result = await db.auth.signInAnonymously();
      if (result.error) throw result.error;
      user = result.data.user;
    }

    $("status").textContent = "匿名登入成功，可以開始配對。";
    $("start").disabled = false;
    $("start").textContent = "開始尋找聊天對象";

  } catch (error) {
    console.error(error);
    $("status").textContent = "連線失敗：" + error.message;
  }
}

async function saveProfile() {
  const nickname = $("nickname").value.trim();

  if (!nickname) throw new Error("請輸入暱稱");
  if (!gender) throw new Error("請選擇你的性別");

  const {error} = await db.from("profiles").upsert({
    id: user.id,
    nickname: nickname,
    gender: gender,
    seeking: seeking
  }, {onConflict:"id"});

  if (error) throw error;
}

async function showMatchedNickname() {
  const {data, error} = await db.rpc("get_match_nickname");

  if (error) throw error;

  if (data.status === "matched" && data.nickname) {
    $("roomTitle").textContent = "正在與 " + data.nickname + " 聊天";
    message(
      "🎉 真人配對成功！",
      "你配對到的對象是：" + data.nickname + "。聊天訊息功能接下來開發。"
    );
  } else {
    $("roomTitle").textContent = "配對成功！";
    message(
      "🎉 真人配對成功！",
      "聊天室已建立，但暫時無法讀取對方暱稱。"
    );
  }
}

async function findMatch() {
  if (!searching) return;

  try {
    const {data, error} = await db.rpc("find_match");
    if (error) throw error;

    if (data.status === "matched") {
      searching = false;
      clearTimeout(timer);

      $("start").disabled = false;
      $("start").textContent = "重新配對";
      $("status").textContent = "已找到聊天對象。";

      await showMatchedNickname();
      return;
    }

    if (data.status === "waiting") {
      $("status").textContent = "正在尋找符合條件的真人使用者...";
      message("正在尋找聊天對象", "請稍候，配對成功後會通知你。");
      timer = setTimeout(findMatch, 3000);
      return;
    }

    throw new Error("配對狀態：" + data.status);

  } catch (error) {
    console.error(error);
    searching = false;

    $("start").disabled = false;
    $("start").textContent = "重新開始";
    $("status").textContent = "配對失敗：" + error.message;
  }
}

$("start").onclick = async () => {
  if (searching) return;

  $("start").disabled = true;
  $("start").textContent = "正在保存資料...";

  try {
    await saveProfile();

    searching = true;
    $("start").textContent = "配對中...";
    $("status").textContent = "正在連接真人配對服務...";

    await findMatch();

  } catch (error) {
    console.error(error);

    searching = false;
    $("start").disabled = false;
    $("start").textContent = "開始尋找聊天對象";
    $("status").textContent = error.message;
  }
};

initialize();
</script>
</body>
</html>
