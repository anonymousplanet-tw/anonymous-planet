function removeSubscriptions(){if(messageChannel)db.removeChannel(messageChannel);if(roomChannel)db.removeChannel(roomChannel);messageChannel=null;roomChannel=null}
function resetChat(){clearTimers();pwLastId=0;removeSubscriptions();roomId=null;partnerId=null;roomEnded=false;displayedMessageIds.clear();$("messages").innerHTML="";$("endedPanel").classList.add("hidden");$("chatActions").classList.remove("hidden");$("sendArea").classList.remove("hidden");$("menu").style.display="none"}
async function recordStatistic(kind){try{const {error}=await db.rpc("record_site_stat",{p_kind:kind});if(error)console.warn("統計記錄失敗",kind,error.message)}catch(e){console.warn("統計記錄失敗",kind,e)}}
async function initialize(){try{const {data,error}=await db.auth.getSession();if(error)throw error;if(data.session)user=data.session.user;else{const r=await db.auth.signInAnonymously();if(r.error)throw r.error;user=r.data.user}$("startButton").disabled=false;$("startButton").textContent="開始配對";void recordStatistic("visit");void refreshOnline();onlineTimer=setInterval(refreshOnline,30000);const pw=await db.rpc("ac_pw_status");if(!pw.error&&pw.data?.status==="matched"){chatMode="password";await openPasswordRoom(pw.data)}else if(!pw.error&&pw.data?.status==="waiting"){chatMode="password";searching=true;showWaiting();startPasswordWaiting()}else await restoreRoom()}catch(e){alert("連線初始化失敗："+e.message)}}
async function saveProfile(){const nickname=$("nickname").value.trim();if(!nickname)throw new Error("請輸入暱稱");if(!gender)throw new Error("請選擇你的性別");const {error}=await db.from("profiles").upsert({id:user.id,nickname,gender,seeking},{onConflict:"id"});if(error)throw error}
async function getPartner(){// 此 RPC 是無參數函式，勿傳入 room_id
 const {data,error}=await db.rpc("get_match_nickname");if(error)throw error;if(!data||data.status!=="matched")throw new Error("目前無法取得聊天室資料："+(data?.status||"unknown"));roomId=data.room_id;partnerId=data.partner_id;$("partnerName").textContent=data.nickname||"匿名使用者";const g={male:"男生",female:"女生",other:"其他"};$("partnerInfo").textContent=g[data.gender]||""}
function renderMessage(m){if(displayedMessageIds.has(String(m.id)))return;displayedMessageIds.add(String(m.id));const d=document.createElement("div");d.className="bubble"+(m.sender_id===user.id?" mine":"");const c=document.createElement("div");c.textContent=m.content;const t=document.createElement("div");t.className="time";t.textContent=new Date(m.created_at).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});d.append(c,t);$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight}
async function loadMessages(){const {data,error}=await db.from("messages").select("id,sender_id,content,created_at").eq("room_id",roomId).order("created_at",{ascending:true});if(error)throw error;$("messages").innerHTML="";displayedMessageIds.clear();(data||[]).forEach(renderMessage)}
function subscribeMessages(){messageChannel=db.channel("messages-"+roomId).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"room_id=eq."+roomId},p=>{if(!p.new||!roomId||p.new.room_id!==roomId)return;const fresh=!displayedMessageIds.has(String(p.new.id));renderMessage(p.new);if(fresh&&p.new.sender_id!==user.id&&!roomEnded)playIncomingSound()}).subscribe()}
function partnerLeft(){if(roomEnded)return;roomEnded=true;clearTimers();removeSubscriptions();$("endedPanel").classList.remove("hidden");$("chatActions").classList.add("hidden");$("sendArea").classList.add("hidden");$("menu").style.display="none"}
async function checkRoomStatus(){if(!roomId||roomEnded)return;try{const {data,error}=await db.rpc("get_current_room");if(error)throw error;if(!data||data.status!=="matched"||data.room_id!==roomId)partnerLeft()}catch(e){console.warn(e)}}
function subscribeRoom(){roomChannel=db.channel("room-"+roomId).on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"id=eq."+roomId},p=>{if(p.new.status==="closed")partnerLeft()}).subscribe();roomStatusTimer=setInterval(checkRoomStatus,3000)}
async function openRoom(){resetChat();await getPartner();showChat();void recordStatistic("matched");await loadMessages();subscribeMessages();subscribeRoom()}
async function restoreRoom(){const {data,error}=await db.rpc("get_current_room");if(error)throw error;if(data&&data.status==="matched")await openRoom();else showSetup()}
async function findMatch(run){if(!searching||run!==matchRunId)return;try{const {data,error}=await db.rpc("find_match");if(error)throw error;if(run!==matchRunId||!searching)return;if(data.status==="matched"){searching=false;queueMayExist=false;clearTimers();await openRoom();playMatchedSound();return}if(data.status==="waiting"){pollTimer=setTimeout(()=>findMatch(run),3000);return}throw new Error("配對狀態："+data.status)}catch(e){if(run!==matchRunId)return;searching=false;clearTimers();alert("配對發生問題："+e.message);showSetup()}}
async function beginMatching(fromSetup){setModeUI();if(chatMode==="password")return beginPasswordMatching();if(searching)return;if(fromSetup){try{await saveProfile()}catch(e){alert(e.message);return}}resetChat();searching=true;queueMayExist=true;const run=++matchRunId;showWaiting();void recordStatistic("start");findMatch(run)}
async function stopMatching(){if(chatMode==="password")return stopPasswordMatching();searching=false;matchRunId++;clearTimers();if(!queueMayExist){showSetup();return}try{const {data,error}=await db.rpc("cancel_match");if(error)throw error;if(data?.status==="matched"){queueMayExist=false;await openRoom();playMatchedSound();return}queueMayExist=false;showSetup()}catch(e){alert("取消配對失敗："+e.message+"。請再按一次取消。");showWaiting()}}
async function sendMessage(){if(chatMode==="password")return sendPasswordMessage();if(roomEnded||!roomId)return;const content=$("messageInput").value.trim();if(!content)return;$("sendButton").disabled=true;const {error}=await db.from("messages").insert({room_id:roomId,sender_id:user.id,content});$("sendButton").disabled=false;if(error){alert("訊息傳送失敗："+error.message);return}$("messageInput").value=""}
async function leaveRoom(){if(chatMode==="password")return leavePasswordRoom();if(!roomEnded){const {error}=await db.rpc("chat_leave_room",{p_room_id:roomId});if(error){alert("離開聊天室失敗："+error.message);return}}resetChat();showSetup()}
async function blockPartner(){if(!partnerId)return;if(!confirm("確定封鎖這位對象？"))return;const {error}=await db.from("blocks").insert({blocker_id:user.id,blocked_id:partnerId});if(error){alert("封鎖失敗："+error.message);return}alert("已封鎖");await leaveRoom()}
async function reportPartner(){if(!partnerId||!roomId)return;const reason=prompt("請輸入檢舉原因：");if(!reason?.trim())return;const {error}=await db.from("reports").insert({reporter_id:user.id,reported_user_id:partnerId,room_id:roomId,reason:reason.trim(),details:""});if(error){alert("檢舉失敗："+error.message);return}alert("檢舉已送出")}
async function refreshOnline(){try{const {data,error}=await db.rpc("ac_presence_ping");if(error)throw error;const real=Number(data?.online);if(Number.isFinite(real))$("onlineMini").textContent=`在線 ${real+2} 人`;else $("onlineMini").textContent="在線統計暫不可用"}catch(e){$("onlineMini").textContent="在線統計暫不可用";console.warn(e)}}
function setModeUI(){chatMode=$('passwordCode').value.length?'password':'random';$('startButton').textContent=chatMode==='password'?'開始約定密碼配對':'開始配對';$('waitingText').textContent=chatMode==='password'?'正在等待輸入相同約定密碼的對象…':'正在為你尋找合適的聊天對象，請稍候…'}
$('passwordCode').addEventListener('input',setModeUI);
async function beginPasswordMatching(){if(searching||pwBusy)return;const nickname=$("nickname").value.trim(),password=$("passwordCode").value;if(!nickname){alert("請輸入暱稱");return}if(password.length<1||password.length>80){alert("約定密碼需 1～80 字元");return}pwBusy=true;try{const {data,error}=await db.rpc("ac_pw_match",{p_password:password,p_nickname:nickname});if(error)throw error;searching=true;showWaiting();if(data.status==="matched"){searching=false;await openPasswordRoom(data);playMatchedSound()}else startPasswordWaiting()}catch(e){alert("密碼配對失敗："+e.message);showSetup()}finally{pwBusy=false}}
function startPasswordWaiting(){if(pwPollTimer)clearInterval(pwPollTimer);pwPollTimer=setInterval(async()=>{if(!searching||chatMode!=="password")return;try{const {data,error}=await db.rpc("ac_pw_wait");if(error)throw error;if(data.status==="matched"){searching=false;clearTimers();await openPasswordRoom(data);playMatchedSound()}else if(data.status==="idle"){searching=false;clearTimers();showSetup()}}catch(e){console.warn("密碼配對查詢失敗",e)}},3000)}
async function stopPasswordMatching(){searching=false;clearTimers();try{const {data,error}=await db.rpc("ac_pw_cancel");if(error)throw error;if(data.status==="matched"){await openPasswordRoom(data);return}showSetup()}catch(e){alert("取消密碼配對失敗："+e.message);showWaiting()}}
async function openPasswordRoom(data){resetChat();roomId=data.room_id;partnerId=data.partner_id;roomEnded=false;$("partnerName").textContent=data.nickname||"匿名使用者";$("partnerInfo").textContent="約定密碼聊天室";$("menuButton").classList.add("hidden");$("messageInput").value="";showChat();void recordStatistic("matched");await pollPasswordRoom();pwPollTimer=setInterval(pollPasswordRoom,2000)}
async function pollPasswordRoom(){if(!roomId||chatMode!=="password")return;try{const {data,error}=await db.rpc("ac_pw_messages",{p_room_id:roomId,p_after_id:pwLastId});if(error)throw error;for(const m of data.messages||[]){const fresh=!displayedMessageIds.has(String(m.id));renderMessage(m);pwLastId=Math.max(pwLastId,Number(m.id));if(fresh&&m.sender_id!==user.id&&!roomEnded)playIncomingSound()}if(data.status==="closed"&&!roomEnded)partnerLeft()}catch(e){console.warn("密碼聊天室同步失敗",e)}}
async function sendPasswordMessage(){if(roomEnded||!roomId||pwBusy)return;const content=$("messageInput").value.trim();if(!content)return;pwBusy=true;$("sendButton").disabled=true;try{const {error}=await db.rpc("ac_pw_send",{p_room_id:roomId,p_content:content});if(error)throw error;$("messageInput").value="";await pollPasswordRoom()}catch(e){alert("傳送失敗："+e.message)}finally{pwBusy=false;$("sendButton").disabled=false}}
async function leavePasswordRoom(){if(!roomEnded&&roomId){const {error}=await db.rpc("ac_pw_leave",{p_room_id:roomId});if(error){alert("離開失敗："+error.message);return}}resetChat();$("menuButton").classList.remove("hidden");showSetup()}
$("startButton").onclick=()=>beginMatching(true);$("cancelButton").onclick=stopMatching;$("sendButton").onclick=sendMessage;$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendMessage()}});$("leaveButton").onclick=leaveRoom;$("endedLeaveButton").onclick=leaveRoom;$("menuButton").onclick=()=>{$("menu").style.display=$("menu").style.display==="block"?"none":"block"};$("blockButton").onclick=blockPartner;$("reportButton").onclick=reportPartner;
initialize();
</script></body></html>
