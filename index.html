<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匿名聊聊</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3fb;color:#29263b;font-family:Arial,"Microsoft JhengHei",sans-serif}header{background:#fff;padding:18px 7%;font-size:22px;font-weight:bold;color:#7658df;box-shadow:0 2px 10px #00000008}main{max-width:680px;margin:32px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 5px 25px #00000008}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin:0 0 20px}.muted{color:#888;font-size:14px;line-height:1.7}label{display:block;font-weight:bold;font-size:14px;margin:20px 0 9px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:16px}.options{display:flex;gap:9px}.options button{flex:1;background:#f4f2f9;color:#555;border:1px solid #e8e4f1;padding:13px 6px;font-size:15px}.options button.active{background:#eee8ff;color:#7658df;border:1px solid #7658df;font-weight:bold}.primary,.secondary,.danger{border:0;border-radius:9px;padding:13px 16px;font-size:15px;cursor:pointer}.primary{background:#7658df;color:#fff}.secondary{background:#eee;color:#444}.danger{background:#fff0f0;color:#c33}button:disabled{opacity:.5;cursor:not-allowed}.full{width:100%;margin-top:22px}.hidden{display:none!important}.status{text-align:center;background:#f5f3fb;padding:22px 14px;border-radius:10px;margin-top:18px;line-height:1.8;color:#666}.spinner{width:28px;height:28px;border:3px solid #e5ddff;border-top-color:#7658df;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}.chathead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.chathead h2{margin:0 0 4px}.menuWrap{position:relative}.menuButton{width:38px;height:38px;border-radius:50%;background:#f0edf9;color:#7658df;font-weight:bold;font-size:19px}.menu{display:none;position:absolute;right:0;top:44px;z-index:5;background:white;border:1px solid #eee;border-radius:10px;box-shadow:0 5px 20px #0002;min-width:130px;overflow:hidden}.menu button{display:block;width:100%;border:0;background:white;text-align:left;padding:12px}.menu button:hover{background:#f5f3fb}.messages{height:390px;overflow:auto;background:#f8f7fb;border-radius:12px;padding:12px}.bubble{background:#eeeaf7;border-radius:12px;padding:10px 13px;margin:9px 0;max-width:85%;width:fit-content;overflow-wrap:anywhere;white-space:pre-wrap}.mine{background:#7658df;color:white;margin-left:auto}.time{font-size:11px;opacity:.65;margin-top:5px}.sendrow{display:flex;gap:8px;margin-top:12px}.sendrow input{flex:1;min-width:0}.sendrow button{background:#7658df;color:white}.ended{margin-top:14px;padding:16px;background:#f5f3fb;border-radius:12px;text-align:center}.ended p{margin:0 0 6px;font-weight:bold}.small{font-size:12px;color:#999}
/* 聊天中的離開按鈕保持低調，不與傳送訊息搶焦點 */
#chatActions{justify-content:flex-end;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid #f0eef5}
#chatActions button{flex:0 0 auto;padding:6px 10px;font-size:12px;border-radius:7px;font-weight:normal}
#chatActions .secondary{background:#fff0f1;color:#b33448;border:1px solid #f2b9c2}#chatActions .secondary:hover{background:#ffe1e6;color:#972438}
/* 對方離開後，操作按鈕也維持精簡 */
#endedPanel .actions{justify-content:center;gap:8px;margin-top:12px}
#endedPanel .actions button{flex:0 1 auto;padding:8px 12px;font-size:13px}
footer{text-align:center;color:#aaa;padding:28px;font-size:12px}@media(max-width:500px){main{margin:18px auto}.card{padding:19px}.messages{height:55vh}.options{gap:6px}.options button{padding:12px 4px;font-size:14px}}
.inboxrow{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid #eee;background:#fff;padding:14px 4px;text-align:left;cursor:pointer}.avatar{background:#7658df;color:white;border-radius:50%;height:44px;width:44px;display:grid;place-items:center;flex-shrink:0}.inboxbody{flex:1;min-width:0}.inboxmeta{display:flex;justify-content:space-between;gap:8px}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#888;font-size:13px;margin-top:5px}.unread{background:#7658df;color:white;border-radius:15px;padding:2px 7px;font-size:12px}.navrow{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:14px}.navrow button{padding:8px 12px}.chathead{align-items:flex-start}
</style>
</head>
<body>
<header>✦ 匿名聊聊</header>
<main>
<section id="setupPage" class="card">
  <div id="settingsPanel">
    <h1>開始聊天</h1><p class="muted">選擇聊天偏好，開始一段新的對話。</p>
    <label for="nickname">暱稱</label><input id="nickname" maxlength="20" placeholder="輸入暱稱">
    <label>你的性別</label><div class="options" id="gender"><button type="button" data-value="male">男生</button><button type="button" data-value="female">女生</button><button type="button" data-value="other">其他</button></div>
    <label>想認識的對象</label><div class="options" id="seeking"><button type="button" data-value="male">男生</button><button type="button" data-value="female">女生</button><button type="button" class="active" data-value="any">不限</button></div>
    <button class="primary full" id="startButton" disabled>正在連線…</button>
  </div>
  <div id="waitingPanel" class="hidden">
    <h2 style="text-align:center">正在尋找聊天對象</h2>
    <div class="status"><div class="spinner"></div><span id="waitingText">正在為你尋找合適的聊天對象，請稍候…</span></div>
    <div class="actions"><button class="secondary" id="waitingBack">返回列表</button><button class="danger" id="cancelButton">取消配對</button></div>
  </div>
</section>
<section id="listPage" class="card" style="margin-top:18px">
 <h2 style="margin:0 0 12px">聊天列表</h2>
 <div id="inboxList"></div>
</section>
<section id="chatPage" class="card hidden">
  <div class="chathead"><button class="secondary" id="backToList">← 列表</button><div><h2 id="partnerName">匿名聊天室</h2><div class="muted" id="partnerInfo">已配對</div></div><div class="menuWrap"><button class="menuButton" id="menuButton" aria-label="更多選項">！</button><div class="menu" id="menu"><button id="reportButton">檢舉</button><button id="blockButton">封鎖</button></div></div></div>
  <div class="messages" id="messages"></div>
  <div id="sendArea"><div class="sendrow"><input id="messageInput" maxlength="2000" placeholder="輸入訊息…"><button id="sendButton">傳送</button></div></div>
  <div id="endedPanel" class="ended hidden"><p>對方已離開聊天室</p><div class="muted">聊天已結束，你可以離開聊天室。</div><div class="actions"><button class="secondary" id="endedLeaveButton">離開聊天室</button></div></div>
  <div id="chatActions" class="actions"><button class="secondary" id="leaveButton">離開聊天室</button></div>
</section>
</main>
<footer>匿名聊聊 · 從一段對話開始</footer>
<script>
const SUPABASE_URL="https://rxeolvxuvhysvgwvnkmu.supabase.co";
const SUPABASE_KEY="sb_publishable_JC0K_2qN8_GMv9qXFjxohQ_WGWwlPTM";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let user=null,gender="",seeking="any",roomId=null,partnerId=null,searching=false,matchRunId=0,pollTimer=null,roomStatusTimer=null,messageChannel=null,displayedMessageIds=new Set(),inboxTimer=null,roomEnded=false;
function choose(id,callback){$(id).querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{$(id).querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");callback(b.dataset.value)}))}
choose("gender",v=>gender=v);choose("seeking",v=>seeking=v);
function hidePages(){for(const id of ["setupPage","chatPage","listPage"])$(id).classList.add("hidden")}
function showSetup(){stopRoomView();hidePages();$("setupPage").classList.remove("hidden");$("listPage").classList.remove("hidden");$("settingsPanel").classList.remove("hidden");$("waitingPanel").classList.add("hidden")}
function showWaiting(){stopRoomView();hidePages();$("setupPage").classList.remove("hidden");$("listPage").classList.remove("hidden");$("settingsPanel").classList.add("hidden");$("waitingPanel").classList.remove("hidden")}
function showChat(){hidePages();$("chatPage").classList.remove("hidden")}
function stopRoomView(){if(roomStatusTimer)clearInterval(roomStatusTimer);roomStatusTimer=null;if(messageChannel)db.removeChannel(messageChannel);messageChannel=null}
function stopPolling(){searching=false;matchRunId++;if(pollTimer)clearTimeout(pollTimer);pollTimer=null}
function resetChat(){stopRoomView();roomId=null;partnerId=null;roomEnded=false;displayedMessageIds.clear();$("messages").replaceChildren();$("endedPanel").classList.add("hidden");$("chatActions").classList.remove("hidden");$("sendArea").classList.remove("hidden");$("menu").style.display="none"}
async function rpc(name,args){const {data,error}=await db.rpc(name,args||{});if(error)throw error;return data}
async function initialize(){try{const {data,error}=await db.auth.getSession();if(error)throw error;if(data.session)user=data.session.user;else{const r=await db.auth.signInAnonymously();if(r.error)throw r.error;user=r.data.user}$("startButton").disabled=false;$("startButton").textContent="開始配對";await showList();inboxTimer=setInterval(()=>{if(!$("listPage").classList.contains("hidden"))loadInbox().catch(console.warn)},4000)}catch(e){alert("連線初始化失敗："+e.message)}}
async function saveProfile(){const nickname=$("nickname").value.trim();if(!nickname)throw new Error("請輸入暱稱");if(!gender)throw new Error("請選擇你的性別");const {error}=await db.from("profiles").upsert({id:user.id,nickname,gender,seeking},{onConflict:"id"});if(error)throw error}
function timeLabel(v){return v?new Date(v).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):""}
async function loadInbox(){const data=await rpc("chat_list_rooms");const host=$("inboxList");host.replaceChildren();if(!data?.length)return;for(const r of data){const b=document.createElement("button");b.className="inboxrow";const avatar=document.createElement("span");avatar.className="avatar";avatar.textContent=(r.nickname||"匿").slice(0,1);const body=document.createElement("span");body.className="inboxbody";const meta=document.createElement("span");meta.className="inboxmeta";const title=document.createElement("strong");title.textContent=r.nickname||"匿名使用者";const when=document.createElement("small");when.textContent=timeLabel(r.last_message_at||r.created_at);meta.append(title,when);const prev=document.createElement("div");prev.className="preview";prev.textContent=r.status==="active"?(r.last_message||"配對成功，開始聊天吧"):("對方已離開 · "+(r.last_message||"聊天已結束"));body.append(meta,prev);b.append(avatar,body);if(Number(r.unread)>0){const n=document.createElement("span");n.className="unread";n.textContent=Number(r.unread)>99?"99+":String(r.unread);b.append(n)}b.onclick=()=>openRoom(r.room_id).catch(e=>alert("開啟聊天室失敗："+e.message));host.append(b)}}
async function showList(){
 resetChat();showSetup();
 try{await loadInbox()}catch(e){console.error(e);alert("讀取聊天室列表失敗："+e.message)}
}
function renderMessage(m){if(displayedMessageIds.has(String(m.id)))return;displayedMessageIds.add(String(m.id));const d=document.createElement("div");d.className="bubble"+(m.sender_id===user.id?" mine":"");const c=document.createElement("div");c.textContent=m.content;const t=document.createElement("div");t.className="time";t.textContent=new Date(m.created_at).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});d.append(c,t);$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight}
async function loadMessages(id){const {data,error}=await db.from("messages").select("id,sender_id,content,created_at").eq("room_id",id).order("created_at",{ascending:true});if(error)throw error;if(roomId!==id)return;$("messages").replaceChildren();displayedMessageIds.clear();(data||[]).forEach(renderMessage)}
function partnerLeft(){if(roomEnded)return;roomEnded=true;$("endedPanel").classList.remove("hidden");$("chatActions").classList.add("hidden");$("sendArea").classList.add("hidden");$("menu").style.display="none"}
async function checkRoomStatus(id){if(roomId!==id)return;try{const info=await rpc("chat_room_info",{p_room_id:id});if(roomId===id&&info.status!=="active")partnerLeft()}catch(e){console.warn(e)}}
async function openRoom(id){resetChat();roomId=id;const info=await rpc("chat_room_info",{p_room_id:id});if(roomId!==id)return;partnerId=info.partner_id;$("partnerName").textContent=info.nickname||"匿名使用者";$("partnerInfo").textContent=({male:"男生",female:"女生",other:"其他"})[info.gender]||"";showChat();await loadMessages(id);if(roomId!==id)return;await rpc("chat_mark_read",{p_room_id:id});if(info.status!=="active"){partnerLeft();return}messageChannel=db.channel("messages-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"room_id=eq."+id},p=>{if(roomId===id){renderMessage(p.new);rpc("chat_mark_read",{p_room_id:id}).catch(console.warn)}}).subscribe();roomStatusTimer=setInterval(()=>checkRoomStatus(id),3000)}
async function findMatch(run){if(!searching||run!==matchRunId)return;try{const data=await rpc("find_match");if(run!==matchRunId||!searching)return;if(data.status==="matched"){stopPolling();await openRoom(data.room_id);return}if(data.status==="waiting"){pollTimer=setTimeout(()=>findMatch(run),3000);return}throw new Error("配對狀態："+data.status)}catch(e){if(run!==matchRunId)return;stopPolling();alert("配對發生問題："+e.message);await showList()}}
async function beginMatching(){if(searching)return;try{await saveProfile()}catch(e){alert(e.message);return}searching=true;const run=++matchRunId;showWaiting();findMatch(run)}
async function stopMatching(){stopPolling();try{await rpc("cancel_match");await showList()}catch(e){alert("取消配對失敗："+e.message)}}
async function sendMessage(){if(roomEnded||!roomId)return;const id=roomId;const content=$("messageInput").value.trim();if(!content)return;$("sendButton").disabled=true;try{const {error}=await db.from("messages").insert({room_id:id,sender_id:user.id,content});if(error)throw error;$("messageInput").value="";await loadMessages(id);await rpc("chat_mark_read",{p_room_id:id})}catch(e){alert("訊息傳送失敗："+e.message)}finally{$("sendButton").disabled=false}}
async function leaveRoom(){if(!roomId)return;const id=roomId;if(!confirm("確定離開這個聊天室？離開後將無法繼續聊天。"))return;try{await rpc("chat_leave_room",{p_room_id:id});await showList()}catch(e){alert("離開聊天室失敗："+e.message)}}
async function blockPartner(){if(!partnerId)return;if(!confirm("確定封鎖這位對象？"))return;const {error}=await db.from("blocks").insert({blocker_id:user.id,blocked_id:partnerId});if(error){alert("封鎖失敗："+error.message);return}alert("已封鎖");await leaveRoom()}
async function reportPartner(){if(!partnerId||!roomId)return;const reason=prompt("請輸入檢舉原因：");if(!reason?.trim())return;const {error}=await db.from("reports").insert({reporter_id:user.id,reported_user_id:partnerId,room_id:roomId,reason:reason.trim(),details:""});if(error){alert("檢舉失敗："+error.message);return}alert("檢舉已送出")}
$("startButton").onclick=beginMatching;$("backToList").onclick=showList;$("cancelButton").onclick=stopMatching;$("waitingBack").onclick=stopMatching;$("sendButton").onclick=sendMessage;$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendMessage()}});$("leaveButton").onclick=leaveRoom;$("endedLeaveButton").onclick=leaveRoom;$("menuButton").onclick=()=>{$("menu").style.display=$("menu").style.display==="block"?"none":"block"};$("blockButton").onclick=blockPartner;$("reportButton").onclick=reportPartner;
initialize();
</script></body></html>
