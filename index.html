<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匿名聊聊</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3fb;color:#29263b;font-family:Arial,"Microsoft JhengHei",sans-serif}header{background:#fff;padding:18px 7%;font-size:22px;font-weight:bold;color:#7658df;box-shadow:0 2px 10px #00000008}main{max-width:680px;margin:32px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 5px 25px #00000008}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin:0 0 20px}.muted{color:#888;font-size:14px;line-height:1.7}label{display:block;font-weight:bold;font-size:14px;margin:20px 0 9px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:16px}.options{display:flex;gap:9px}.options button{flex:1;background:#f4f2f9;color:#555;border:1px solid #e8e4f1;padding:13px 6px;font-size:15px}.options button.active{background:#eee8ff;color:#7658df;border:1px solid #7658df;font-weight:bold}.primary,.secondary,.danger{border:0;border-radius:9px;padding:13px 16px;font-size:15px;cursor:pointer}.primary{background:#7658df;color:#fff}.secondary{background:#eee;color:#444}.danger{background:#fff0f0;color:#c33}button:disabled{opacity:.5;cursor:not-allowed}.full{width:100%;margin-top:22px}.hidden{display:none!important}.status{text-align:center;background:#f5f3fb;padding:22px 14px;border-radius:10px;margin-top:18px;line-height:1.8;color:#666}.spinner{width:28px;height:28px;border:3px solid #e5ddff;border-top-color:#7658df;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}.chathead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.chathead h2{margin:0 0 4px}.menuWrap{position:relative}.menuButton{width:38px;height:38px;border-radius:50%;background:#f0edf9;color:#7658df;font-weight:bold;font-size:19px}.menu{display:none;position:absolute;right:0;top:44px;z-index:5;background:white;border:1px solid #eee;border-radius:10px;box-shadow:0 5px 20px #0002;min-width:130px;overflow:hidden}.menu button{display:block;width:100%;border:0;background:white;text-align:left;padding:12px}.menu button:hover{background:#f5f3fb}.messages{height:390px;overflow:auto;background:#f8f7fb;border-radius:12px;padding:12px}.bubble{background:#eeeaf7;border-radius:12px;padding:10px 13px;margin:9px 0;max-width:85%;width:fit-content;overflow-wrap:anywhere;white-space:pre-wrap}.mine{background:#7658df;color:white;margin-left:auto}.time{font-size:11px;opacity:.65;margin-top:5px}.sendrow{display:flex;gap:8px;margin-top:12px}.sendrow input{flex:1;min-width:0}.sendrow button{background:#7658df;color:white}.ended{margin-top:14px;padding:16px;background:#f5f3fb;border-radius:12px;text-align:center}.ended p{margin:0 0 6px;font-weight:bold}.small{font-size:12px;color:#999}
/* 聊天中的離開／重新尋找：降低視覺權重，不與傳送訊息搶焦點 */
#chatActions{justify-content:flex-end;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid #f0eef5}
#chatActions button{flex:0 0 auto;padding:6px 10px;font-size:12px;border-radius:7px;font-weight:normal}
#chatActions .secondary{background:transparent;color:#999;border:1px solid #eee}
#chatActions .primary{background:#faf9ff;color:#8069c9;border:1px solid #eee8ff}
/* 對方離開後，操作按鈕也維持精簡 */
#endedPanel .actions{justify-content:center;gap:8px;margin-top:12px}
#endedPanel .actions button{flex:0 1 auto;padding:8px 12px;font-size:13px}
footer{text-align:center;color:#aaa;padding:28px;font-size:12px}@media(max-width:500px){main{margin:18px auto}.card{padding:19px}.messages{height:55vh}.options{gap:6px}.options button{padding:12px 4px;font-size:14px}}
</style>
</head>
<body>
<header>✦ 匿名聊聊</header>
<main>
<section id="setupPage" class="card">
  <div id="settingsPanel">
    <h1>開始聊天</h1><p class="muted">選擇聊天偏好，開始一段新的對話。</p>
    <label for="nickname">暱稱</label><input id="nickname" maxlength="20" placeholder="輸入暱稱">
    <label>你的性別</label><div class="options" id="gender"><button type="button" data-value="male">男生</button><button type="button" data-value="female">女生</button><button type="button" data-value="other">其他</button></div>
    <label>想認識的對象</label><div class="options" id="seeking"><button type="button" data-value="male">男生</button><button type="button" data-value="female">女生</button><button type="button" class="active" data-value="any">不限</button></div>
    <button class="primary full" id="startButton" disabled>正在連線…</button>
  </div>
  <div id="waitingPanel" class="hidden">
    <h2 style="text-align:center">正在尋找聊天對象</h2>
    <div class="status"><div class="spinner"></div><span id="waitingText">正在為你尋找合適的聊天對象，請稍候…</span></div>
    <div class="actions"><button class="secondary" id="previousButton">上一頁</button><button class="danger" id="cancelButton">取消配對</button></div>
  </div>
</section>
<section id="chatPage" class="card hidden">
  <div class="chathead"><div><h2 id="partnerName">匿名聊天室</h2><div class="muted" id="partnerInfo">已配對</div></div><div class="menuWrap"><button class="menuButton" id="menuButton" aria-label="更多選項">！</button><div class="menu" id="menu"><button id="reportButton">檢舉</button><button id="blockButton">封鎖</button></div></div></div>
  <div class="messages" id="messages"></div>
  <div id="sendArea"><div class="sendrow"><input id="messageInput" maxlength="2000" placeholder="輸入訊息…"><button id="sendButton">傳送</button></div></div>
  <div id="endedPanel" class="ended hidden"><p>對方已離開聊天室</p><div class="muted">聊天紀錄仍保留，你可以離開或重新尋找。</div><div class="actions"><button class="secondary" id="endedLeaveButton">離開聊天室</button><button class="primary" id="endedFindButton">重新尋找</button></div></div>
  <div id="chatActions" class="actions"><button class="secondary" id="leaveButton">離開聊天室</button><button class="primary" id="findAgainButton">重新尋找</button></div>
</section>
</main>
<footer>匿名聊聊 · 從一段對話開始</footer>
<script>
const SUPABASE_URL="https://rxeolvxuvhysvgwvnkmu.supabase.co";
const SUPABASE_KEY="sb_publishable_JC0K_2qN8_GMv9qXFjxohQ_WGWwlPTM";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let user=null,gender="",seeking="any",roomId=null,partnerId=null,searching=false,queueMayExist=false,roomEnded=false,matchRunId=0,pollTimer=null,roomStatusTimer=null,messageChannel=null,roomChannel=null,displayedMessageIds=new Set();
function choose(id,callback){$(id).querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{$(id).querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");callback(b.dataset.value)}))}
choose("gender",v=>gender=v);choose("seeking",v=>seeking=v);
function showSetup(){clearTimers();removeSubscriptions();$("setupPage").classList.remove("hidden");$("settingsPanel").classList.remove("hidden");$("waitingPanel").classList.add("hidden");$("chatPage").classList.add("hidden")}
function showWaiting(){$("setupPage").classList.remove("hidden");$("settingsPanel").classList.add("hidden");$("waitingPanel").classList.remove("hidden");$("chatPage").classList.add("hidden")}
function showChat(){$("setupPage").classList.add("hidden");$("chatPage").classList.remove("hidden")}
function clearTimers(){if(pollTimer)clearTimeout(pollTimer);if(roomStatusTimer)clearInterval(roomStatusTimer);pollTimer=null;roomStatusTimer=null}
function removeSubscriptions(){if(messageChannel)db.removeChannel(messageChannel);if(roomChannel)db.removeChannel(roomChannel);messageChannel=null;roomChannel=null}
function resetChat(){clearTimers();removeSubscriptions();roomId=null;partnerId=null;roomEnded=false;displayedMessageIds.clear();$("messages").innerHTML="";$("endedPanel").classList.add("hidden");$("chatActions").classList.remove("hidden");$("sendArea").classList.remove("hidden");$("menu").style.display="none"}
async function initialize(){try{const {data,error}=await db.auth.getSession();if(error)throw error;if(data.session)user=data.session.user;else{const r=await db.auth.signInAnonymously();if(r.error)throw r.error;user=r.data.user}$("startButton").disabled=false;$("startButton").textContent="開始配對";await restoreRoom()}catch(e){alert("連線初始化失敗："+e.message)}}
async function saveProfile(){const nickname=$("nickname").value.trim();if(!nickname)throw new Error("請輸入暱稱");if(!gender)throw new Error("請選擇你的性別");const {error}=await db.from("profiles").upsert({id:user.id,nickname,gender,seeking},{onConflict:"id"});if(error)throw error}
async function getPartner(){// 此 RPC 是無參數函式，勿傳入 room_id
 const {data,error}=await db.rpc("get_match_nickname");if(error)throw error;if(!data||data.status!=="matched")throw new Error("目前無法取得聊天室資料："+(data?.status||"unknown"));roomId=data.room_id;partnerId=data.partner_id;$("partnerName").textContent=data.nickname||"匿名使用者";const g={male:"男生",female:"女生",other:"其他"};$("partnerInfo").textContent=g[data.gender]||""}
function renderMessage(m){if(displayedMessageIds.has(String(m.id)))return;displayedMessageIds.add(String(m.id));const d=document.createElement("div");d.className="bubble"+(m.sender_id===user.id?" mine":"");const c=document.createElement("div");c.textContent=m.content;const t=document.createElement("div");t.className="time";t.textContent=new Date(m.created_at).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});d.append(c,t);$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight}
async function loadMessages(){const {data,error}=await db.from("messages").select("id,sender_id,content,created_at").eq("room_id",roomId).order("created_at",{ascending:true});if(error)throw error;$("messages").innerHTML="";displayedMessageIds.clear();(data||[]).forEach(renderMessage)}
function subscribeMessages(){messageChannel=db.channel("messages-"+roomId).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"room_id=eq."+roomId},p=>renderMessage(p.new)).subscribe()}
function partnerLeft(){if(roomEnded)return;roomEnded=true;clearTimers();removeSubscriptions();$("endedPanel").classList.remove("hidden");$("chatActions").classList.add("hidden");$("sendArea").classList.add("hidden");$("menu").style.display="none"}
async function checkRoomStatus(){if(!roomId||roomEnded)return;try{const {data,error}=await db.rpc("get_current_room");if(error)throw error;if(!data||data.status!=="matched"||data.room_id!==roomId)partnerLeft()}catch(e){console.warn(e)}}
function subscribeRoom(){roomChannel=db.channel("room-"+roomId).on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"id=eq."+roomId},p=>{if(p.new.status==="closed")partnerLeft()}).subscribe();roomStatusTimer=setInterval(checkRoomStatus,3000)}
async function openRoom(){resetChat();await getPartner();showChat();await loadMessages();subscribeMessages();subscribeRoom()}
async function restoreRoom(){const {data,error}=await db.rpc("get_current_room");if(error)throw error;if(data&&data.status==="matched")await openRoom();else showSetup()}
async function findMatch(run){if(!searching||run!==matchRunId)return;try{const {data,error}=await db.rpc("find_match");if(error)throw error;if(run!==matchRunId||!searching)return;if(data.status==="matched"){searching=false;queueMayExist=false;clearTimers();await openRoom();return}if(data.status==="waiting"){pollTimer=setTimeout(()=>findMatch(run),3000);return}throw new Error("配對狀態："+data.status)}catch(e){if(run!==matchRunId)return;searching=false;clearTimers();alert("配對發生問題："+e.message);showSetup()}}
async function beginMatching(fromSetup){if(searching)return;if(fromSetup){try{await saveProfile()}catch(e){alert(e.message);return}}resetChat();searching=true;queueMayExist=true;const run=++matchRunId;showWaiting();findMatch(run)}
async function stopMatching(destination){searching=false;matchRunId++;clearTimers();if(!queueMayExist){if(destination==="settings")showSetup();return}try{const {data,error}=await db.rpc("cancel_match");if(error)throw error;if(data?.status==="matched"){queueMayExist=false;await openRoom();return}queueMayExist=false;if(destination==="settings")showSetup();else{$("waitingText").textContent="已取消配對，可以返回設定重新開始。";showWaiting()}}catch(e){alert("取消配對失敗："+e.message+"。請再按一次取消。");showWaiting()}}
async function sendMessage(){if(roomEnded||!roomId)return;const content=$("messageInput").value.trim();if(!content)return;$("sendButton").disabled=true;const {error}=await db.from("messages").insert({room_id:roomId,sender_id:user.id,content});$("sendButton").disabled=false;if(error){alert("訊息傳送失敗："+error.message);return}$("messageInput").value=""}
async function leaveRoom(){if(!roomEnded){const {error}=await db.rpc("leave_room");if(error){alert("離開聊天室失敗："+error.message);return}}resetChat();showSetup()}
async function findAgain(){resetChat();await beginMatching(false)}
async function blockPartner(){if(!partnerId)return;if(!confirm("確定封鎖這位對象？"))return;const {error}=await db.from("blocks").insert({blocker_id:user.id,blocked_id:partnerId});if(error){alert("封鎖失敗："+error.message);return}alert("已封鎖");await leaveRoom()}
async function reportPartner(){if(!partnerId||!roomId)return;const reason=prompt("請輸入檢舉原因：");if(!reason?.trim())return;const {error}=await db.from("reports").insert({reporter_id:user.id,reported_user_id:partnerId,room_id:roomId,reason:reason.trim(),details:""});if(error){alert("檢舉失敗："+error.message);return}alert("檢舉已送出")}
$("startButton").onclick=()=>beginMatching(true);$("previousButton").onclick=()=>stopMatching("settings");$("cancelButton").onclick=()=>stopMatching("stay");$("sendButton").onclick=sendMessage;$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendMessage()}});$("leaveButton").onclick=leaveRoom;$("findAgainButton").onclick=findAgain;$("endedLeaveButton").onclick=leaveRoom;$("endedFindButton").onclick=findAgain;$("menuButton").onclick=()=>{$("menu").style.display=$("menu").style.display==="block"?"none":"block"};$("blockButton").onclick=blockPartner;$("reportButton").onclick=reportPartner;
initialize();
</script>
</body>
</html>
