
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匿名聊聊</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3fb;color:#29263b;font-family:Arial,"Microsoft JhengHei",sans-serif}
header{background:#fff;padding:18px 7%;font-size:22px;font-weight:bold;color:#7658df;box-shadow:0 2px 10px #00000008}
main{max-width:760px;margin:35px auto;padding:0 16px}
h1{font-size:27px}
h2{font-size:19px}
.muted{color:#888}
.card{background:white;border-radius:16px;padding:24px;box-shadow:0 5px 25px #00000008}
label{display:block;font-weight:bold;font-size:14px;margin:17px 0 7px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:15px}
button{cursor:pointer;border:0;border-radius:9px;padding:12px;font-size:14px}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{width:100%;background:#7658df;color:white;font-weight:bold;margin-top:20px}
.secondary{background:#eee;color:#444}
.danger{background:#fff0f0;color:#c33}
.options{display:flex;gap:7px}
.options button{flex:1;background:#f4f4f4}
.options button.active{background:#eee8ff;color:#7658df;outline:1px solid #7658df}
.status{background:#f5f3fb;padding:13px;border-radius:9px;margin-top:16px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.hidden{display:none!important}
#setupPage{max-width:500px;margin:auto}
#chatPage{max-width:700px;margin:auto}
.chat{min-height:540px;display:flex;flex-direction:column}
.chathead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chathead h2{margin:0 0 6px}
.messages{flex:1;min-height:300px;max-height:430px;overflow:auto;padding:12px 0}
.bubble{background:#f0edf9;border-radius:12px;padding:10px 13px;margin:9px 0;max-width:85%;width:fit-content;overflow-wrap:anywhere;white-space:pre-wrap}
.mine{background:#7658df;color:white;margin-left:auto}
.time{font-size:11px;opacity:.65;margin-top:5px}
.sendrow{display:flex;gap:8px}
.sendrow input{flex:1;min-width:0}
.sendrow button{background:#7658df;color:white}
.chat-actions{display:flex;gap:8px;margin-top:12px}
.chat-actions button{flex:1}
.menu-wrap{position:relative}
.menu-button{width:34px;height:34px;padding:0;border-radius:50%;background:#f0edf9;color:#7658df;font-size:20px;font-weight:bold}
.menu-dropdown{position:absolute;right:0;top:42px;background:white;min-width:145px;padding:7px;border-radius:10px;box-shadow:0 5px 20px #0002;z-index:10}
.menu-dropdown button{width:100%;text-align:left;background:white;padding:11px}
.menu-dropdown button:hover{background:#f5f3fb}
.menu-dropdown .danger-text{color:#c33}
.waiting{text-align:center;padding:35px 10px 25px}
.waiting-icon{font-size:42px;color:#7658df;margin-bottom:12px}
.waiting h2{font-size:22px}
.waiting p{line-height:1.7}
.waiting-actions{display:flex;gap:9px;margin-top:20px}
.waiting-actions button{flex:1}
footer{text-align:center;color:#aaa;padding:30px;font-size:12px}
@media(max-width:700px){
 main{margin:22px auto}
 .card{padding:19px}
 .chat{min-height:470px}
 .messages{min-height:270px}
 .waiting-actions{flex-direction:column}
}
</style>
</head>
<body>

<header>✦ 匿名聊聊</header>

<main>

<!-- 第一頁：配對設定及配對等待 -->
<section id="setupPage">

  <div id="settingsPanel">
    <h1>遇見一個陌生人</h1>
    <p class="muted">不用真實姓名，從一段聊天開始認識彼此。</p>

    <div class="card">
      <h2>配對設定</h2>

      <label>匿名暱稱</label>
      <input id="nickname" maxlength="20" placeholder="輸入暱稱">

      <label>你的性別</label>
      <div class="options" id="gender">
        <button data-value="male">男生</button>
        <button data-value="female">女生</button>
        <button data-value="other">其他</button>
      </div>

      <label>想認識的對象</label>
      <div class="options" id="seeking">
        <button data-value="male">男生</button>
        <button data-value="female">女生</button>
        <button class="active" data-value="any">不限</button>
      </div>

      <button class="primary" id="start" disabled>正在連接...</button>
      <div class="status" id="status">正在初始化匿名登入...</div>
    </div>
  </div>

  <div id="waitingPanel" class="hidden">
    <div class="card">
      <div class="waiting">
        <div class="waiting-icon" id="waitingIcon">⌕</div>
        <h2 id="waitingTitle">正在尋找聊天對象</h2>
        <p class="muted" id="waitingDescription">
          正在為你尋找符合條件的真人使用者，請稍候。
        </p>
      </div>

      <div class="status" id="waitingStatus">
        配對進行中，找到對象後會自動進入聊天室。
      </div>

      <div class="waiting-actions">
        <button class="secondary" id="previousButton">上一頁</button>
        <button class="danger" id="cancelButton">取消配對</button>
      </div>
    </div>
  </div>

</section>

<!-- 第二頁：聊天 -->
<section id="chatPage" class="hidden">
  <div class="card chat">

    <div class="chathead">
      <div>
        <h2 id="roomTitle">匿名聊天室</h2>
        <div class="muted" id="partnerInfo">尚未配對</div>
      </div>

      <div style="display:flex;align-items:center;gap:10px">
        <span class="muted" id="roomState">等待中</span>

        <div class="menu-wrap">
          <button class="menu-button" id="menuButton" title="更多選項">!</button>
          <div class="menu-dropdown hidden" id="menuDropdown">
            <button id="report">⚑ 檢舉對方</button>
            <button id="block" class="danger-text">⊘ 封鎖對方</button>
          </div>
        </div>
      </div>
    </div>

    <div class="messages" id="messages">
      <p class="muted" style="text-align:center;margin-top:100px">
        配對成功後，就能在這裡聊天。
      </p>
    </div>

    <div id="sendArea" class="hidden">
      <div class="sendrow">
        <input id="messageInput" maxlength="2000" placeholder="輸入訊息...">
        <button id="send">傳送</button>
      </div>
    </div>

    <div class="chat-actions">
      <button class="secondary hidden" id="refreshMessages">重新載入訊息</button>
      <button class="danger hidden" id="leave">離開聊天室</button>
      <button class="primary hidden" id="findAgain">重新尋找聊天對象</button>
    </div>

    <div class="status" id="chatStatus">聊天室狀態</div>
  </div>
</section>

</main>

<footer>匿名聊聊 · 讓每一次相遇，都從聊天開始</footer>

<script>
const SUPABASE_URL = "https://rxeolvxuvhysvgwvnkmu.supabase.co";
const SUPABASE_KEY = "sb_publishable_JC0K_2qN8_GMv9qXFjxohQ_WGWwlPTM";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let gender = "";
let seeking = "any";
let roomId = null;
let partnerId = null;
let partnerNickname = "";
let searching = false;
let pollTimer = null;
let roomStatusTimer = null;
let messageChannel = null;
let roomChannel = null;
let displayedMessageIds = new Set();
let matchRunId = 0;

const $ = id => document.getElementById(id);

function setStatus(text) {
  $("status").textContent = text;
}

function setWaitingStatus(text) {
  $("waitingStatus").textContent = text;
}

function setChatStatus(text) {
  $("chatStatus").textContent = text;
}

function showSetupState(state) {
  $("setupPage").classList.remove("hidden");
  $("chatPage").classList.add("hidden");

  $("settingsPanel").classList.toggle("hidden", state !== "settings");
  $("waitingPanel").classList.toggle("hidden", state !== "waiting");
}

function showChatPage() {
  $("setupPage").classList.add("hidden");
  $("chatPage").classList.remove("hidden");
}

function choose(container, callback) {
  $(container).querySelectorAll("button").forEach(button => {
    button.onclick = () => {
      $(container).querySelectorAll("button").forEach(b => b.classList.remove("active"));
      button.classList.add("active");
      callback(button.dataset.value);
    };
  });
}

choose("gender", value => gender = value);
choose("seeking", value => seeking = value);

function setChatMode(active) {
  $("sendArea").classList.toggle("hidden", !active);
  $("leave").classList.toggle("hidden", !active);
  $("refreshMessages").classList.toggle("hidden", !active);
  $("findAgain").classList.toggle("hidden", active);
}

function removeRoomSubscriptions() {
  if (messageChannel) {
    db.removeChannel(messageChannel);
    messageChannel = null;
  }

  if (roomChannel) {
    db.removeChannel(roomChannel);
    roomChannel = null;
  }

  if (roomStatusTimer) {
    clearInterval(roomStatusTimer);
    roomStatusTimer = null;
  }
}

function resetChat() {
  removeRoomSubscriptions();

  roomId = null;
  partnerId = null;
  partnerNickname = "";
  displayedMessageIds.clear();

  $("roomTitle").textContent = "匿名聊天室";
  $("partnerInfo").textContent = "尚未配對";
  $("roomState").textContent = "等待中";
  $("messages").innerHTML =
    '<p class="muted" style="text-align:center;margin-top:100px">準備尋找下一位聊天對象。</p>';

  $("menuDropdown").classList.add("hidden");
  setChatMode(false);
}

async function initialize() {
  try {
    const {data, error} = await db.auth.getSession();
    if (error) throw error;

    if (data.session) {
      user = data.session.user;
    } else {
      const result = await db.auth.signInAnonymously();
      if (result.error) throw result.error;
      user = result.data.user;
    }

    $("start").disabled = false;
    $("start").textContent = "開始尋找聊天對象";
    setStatus("匿名登入成功，可以開始配對。");

    await restoreRoom();

  } catch (e) {
    console.error(e);
    setStatus("初始化失敗：" + e.message);
    $("start").disabled = true;
  }
}

async function saveProfile() {
  const nickname = $("nickname").value.trim();

  if (!nickname) throw new Error("請輸入暱稱");
  if (!gender) throw new Error("請選擇自己的性別");

  const {error} = await db.from("profiles").upsert({
    id: user.id,
    nickname,
    gender,
    seeking
  }, {onConflict:"id"});

  if (error) throw error;
}

async function getPartner() {
  const {data, error} = await db.rpc("get_match_nickname");
  if (error) throw error;

  if (data.status !== "matched") {
    throw new Error("找不到聊天室對象資料，請重新整理後再試。");
  }

  roomId = data.room_id;
  partnerId = data.partner_id;
  partnerNickname = data.nickname || "匿名使用者";

  $("roomTitle").textContent = "正在與 " + partnerNickname + " 聊天";

  const genderText = {
    male:"男生",
    female:"女生",
    other:"其他"
  };

  $("partnerInfo").textContent =
    "對方性別：" + (genderText[data.gender] || "未提供");
}

function renderMessage(id, text, mine, createdAt) {
  if (displayedMessageIds.has(String(id))) return;
  displayedMessageIds.add(String(id));

  const area = $("messages");
  const div = document.createElement("div");
  div.className = "bubble" + (mine ? " mine" : "");

  const content = document.createElement("div");
  content.textContent = text;

  const time = document.createElement("div");
  time.className = "time";
  time.textContent = createdAt
    ? new Date(createdAt).toLocaleString()
    : "";

  div.append(content, time);
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

async function loadMessages() {
  if (!roomId) return;

  const {data, error} = await db
    .from("messages")
    .select("id,sender_id,content,created_at")
    .eq("room_id", roomId)
    .order("created_at", {ascending:true});

  if (error) throw error;

  $("messages").innerHTML = "";
  displayedMessageIds.clear();

  if (!data.length) {
    $("messages").innerHTML =
      '<p class="muted" style="text-align:center">聊天室已建立，傳送第一則訊息吧！</p>';
    return;
  }

  data.forEach(m => {
    renderMessage(
      m.id,
      m.content,
      m.sender_id === user.id,
      m.created_at
    );
  });
}

function subscribeMessages() {
  if (messageChannel) {
    db.removeChannel(messageChannel);
  }

  messageChannel = db.channel("room-messages-" + roomId)
    .on("postgres_changes", {
      event:"INSERT",
      schema:"public",
      table:"messages",
      filter:"room_id=eq." + roomId
    }, payload => {
      const m = payload.new;
      renderMessage(
        m.id,
        m.content,
        m.sender_id === user.id,
        m.created_at
      );
    })
    .subscribe(status => {
      if (status === "CHANNEL_ERROR") {
        setChatStatus("即時訊息連線發生問題，請重新載入訊息。");
      }
    });
}

/* 對方離開時保留已載入的聊天訊息 */
function handlePartnerLeft() {
  if (!roomId) return;

  removeRoomSubscriptions();

  roomId = null;
  partnerId = null;
  partnerNickname = "";

  $("roomTitle").textContent = "匿名聊天室";
  $("roomState").textContent = "聊天室已結束";
  $("partnerInfo").textContent = "對方已離開聊天室";

  setChatMode(false);
  $("findAgain").disabled = false;
  $("findAgain").textContent = "重新尋找聊天對象";

  const notice = document.createElement("p");
  notice.className = "muted";
  notice.style.textAlign = "center";
  notice.style.padding = "12px";
  notice.textContent = "對方已離開聊天室。你可以重新尋找聊天對象。";

  $("messages").appendChild(notice);
  $("messages").scrollTop = $("messages").scrollHeight;

  setChatStatus("對方已離開，原本的聊天紀錄仍然保留。");
}

async function checkRoomStatus() {
  if (!roomId) return;

  try {
    const {data, error} = await db.rpc("get_current_room");
    if (error) throw error;

    if (
      data.status !== "matched" ||
      data.room_id !== roomId
    ) {
      handlePartnerLeft();
    }
  } catch (e) {
    console.error("檢查聊天室狀態失敗：", e);
  }
}

function subscribeRoomStatus() {
  if (roomChannel) {
    db.removeChannel(roomChannel);
    roomChannel = null;
  }

  roomChannel = db.channel("room-status-" + roomId)
    .on("postgres_changes", {
      event:"UPDATE",
      schema:"public",
      table:"rooms",
      filter:"id=eq." + roomId
    }, payload => {
      if (payload.new.status === "closed") {
        handlePartnerLeft();
      }
    })
    .subscribe(status => {
      if (status === "CHANNEL_ERROR") {
        console.warn("聊天室即時狀態訂閱失敗，將使用定時檢查。");
      }
    });

  if (roomStatusTimer) clearInterval(roomStatusTimer);
  roomStatusTimer = setInterval(checkRoomStatus, 3000);
}

async function openRoom() {
  await getPartner();

  showChatPage();
  $("roomState").textContent = "已配對";
  setChatMode(true);

  $("findAgain").disabled = false;

  await loadMessages();
  subscribeMessages();
  subscribeRoomStatus();

  setChatStatus("聊天室已連線，可以開始聊天。");
}

async function restoreRoom() {
  try {
    const {data, error} = await db.rpc("get_current_room");
    if (error) throw error;

    if (data.status === "matched") {
      roomId = data.room_id;
      await openRoom();
      return;
    }

    showSetupState("settings");
    $("start").disabled = false;
    $("start").textContent = "開始尋找聊天對象";
    setStatus("目前沒有進行中的聊天室，可以開始配對。");

  } catch (e) {
    console.error(e);
    setStatus("檢查聊天室失敗：" + e.message);
    $("start").disabled = false;
    $("start").textContent = "重新嘗試";
  }
}

/* 真人配對輪詢 */
async function findMatch(runId) {
  if (!searching || runId !== matchRunId) return;

  try {
    const {data, error} = await db.rpc("find_match");
    if (error) throw error;

    // 若使用者已取消，忽略舊的配對回應
    if (!searching || runId !== matchRunId) return;

    if (data.status === "matched") {
      searching = false;

      if (pollTimer) {
        clearTimeout(pollTimer);
        pollTimer = null;
      }

      await openRoom();
      return;
    }

    if (data.status === "waiting") {
      setWaitingStatus("正在尋找符合條件的真人使用者...");
      pollTimer = setTimeout(() => findMatch(runId), 3000);
      return;
    }

    throw new Error("配對狀態：" + data.status);

  } catch (e) {
    console.error(e);

    if (!searching || runId !== matchRunId) return;

    searching = false;
    setWaitingStatus("配對失敗：" + e.message);
    $("waitingTitle").textContent = "配對發生問題";
    $("waitingIcon").textContent = "!";
    $("cancelButton").classList.add("hidden");
    $("previousButton").textContent = "返回設定";
  }
}

/* 開始配對 */
async function beginMatching(fromSetup) {
  if (searching) return;

  try {
    await saveProfile();

    if (pollTimer) {
      clearTimeout(pollTimer);
      pollTimer = null;
    }

    resetChat();

    searching = true;
    matchRunId++;
    const thisRunId = matchRunId;

    showSetupState("waiting");

    $("waitingTitle").textContent = "正在尋找聊天對象";
    $("waitingIcon").textContent = "⌕";
    $("waitingDescription").textContent =
      "正在為你尋找符合條件的真人使用者，請稍候。";

    $("cancelButton").classList.remove("hidden");
    $("previousButton").textContent = "上一頁";
    $("cancelButton").disabled = false;
    $("previousButton").disabled = false;

    setWaitingStatus("配對進行中，找到對象後會自動進入聊天室。");

    await findMatch(thisRunId);

  } catch (e) {
    searching = false;
    $("start").disabled = false;
    setStatus(e.message);
    showSetupState("settings");
  }
}

$("start").onclick = () => beginMatching(true);

/* 取消配對：真正從資料庫佇列移除 */
async function stopMatching(destination) {
  if (!searching) {
    if (destination === "settings") {
      showSetupState("settings");
    }
    return;
  }

  // 先阻止舊的輪詢回應改變畫面
  searching = false;
  matchRunId++;

  if (pollTimer) {
    clearTimeout(pollTimer);
    pollTimer = null;
  }

  $("cancelButton").disabled = true;
  $("previousButton").disabled = true;

  setWaitingStatus("正在取消配對...");

  try {
    const {data, error} = await db.rpc("cancel_match");
    if (error) throw error;

    // 取消期間如果剛好配對成功，就進入聊天室
    if (data.status === "matched") {
      $("cancelButton").disabled = false;
      $("previousButton").disabled = false;
      await openRoom();
      return;
    }

    if (data.status !== "cancelled") {
      throw new Error("取消狀態：" + data.status);
    }

    if (destination === "settings") {
      showSetupState("settings");
      setStatus("已取消配對，可以修改設定或重新開始。");
      $("start").disabled = false;
      $("start").textContent = "開始尋找聊天對象";
      return;
    }

    $("waitingTitle").textContent = "已取消配對";
    $("waitingIcon").textContent = "✓";
    $("waitingDescription").textContent =
      "目前已停止搜尋，你可以返回設定頁重新開始。";

    setWaitingStatus("已成功從配對佇列移除，不會繼續尋找對象。");

    $("cancelButton").classList.add("hidden");
    $("previousButton").disabled = false;
    $("previousButton").textContent = "返回設定";

  } catch (e) {
    console.error(e);

    $("cancelButton").disabled = false;
    $("previousButton").disabled = false;

    setWaitingStatus("取消配對失敗：" + e.message +
      "。請再按一次取消，或重新整理頁面。");
  }
}

$("cancelButton").onclick = () => stopMatching("stay");
$("previousButton").onclick = () => stopMatching("settings");

/* 送出訊息 */
async function sendMessage() {
  const content = $("messageInput").value.trim();

  if (!content || !roomId) return;

  $("send").disabled = true;

  try {
    const {error} = await db.from("messages").insert({
      room_id:roomId,
      sender_id:user.id,
      content
    });

    if (error) throw error;

    $("messageInput").value = "";

  } catch (e) {
    alert("訊息傳送失敗：" + e.message);
  } finally {
    $("send").disabled = false;
  }
}

$("send").onclick = sendMessage;

$("messageInput").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMessage();
  }
});

$("refreshMessages").onclick = async () => {
  try {
    await loadMessages();
    setChatStatus("訊息已重新載入。");
  } catch (e) {
    setChatStatus("讀取訊息失敗：" + e.message);
  }
};

/* 離開聊天室 */
$("leave").onclick = async () => {
  if (!confirm("確定要離開聊天室嗎？雙方的聊天室都會結束，但聊天紀錄會保留。")) {
    return;
  }

  try {
    const {data, error} = await db.rpc("leave_room");
    if (error) throw error;

    if (data.status !== "closed" && data.status !== "not_found") {
      throw new Error("無法結束聊天室：" + data.status);
    }

    resetChat();
    showChatPage();

    $("roomState").textContent = "已離開";
    $("partnerInfo").textContent = "你已離開上一個聊天室";
    $("findAgain").disabled = false;
    $("findAgain").textContent = "重新尋找聊天對象";

    setChatStatus("已離開聊天室，聊天紀錄仍保留。");

  } catch (e) {
    alert("離開失敗：" + e.message);
  }
};

$("findAgain").onclick = () => beginMatching(false);

/* 右上角驚嘆號選單 */
$("menuButton").onclick = e => {
  e.stopPropagation();
  $("menuDropdown").classList.toggle("hidden");
};

$("menuDropdown").onclick = e => {
  e.stopPropagation();
};

document.addEventListener("click", () => {
  $("menuDropdown").classList.add("hidden");
});

/* 封鎖 */
$("block").onclick = async () => {
  $("menuDropdown").classList.add("hidden");

  if (!partnerId) {
    alert("目前無法取得對方資料。");
    return;
  }

  if (!confirm("確定封鎖這位使用者嗎？")) return;

  try {
    const {error} = await db.from("blocks").insert({
      blocker_id:user.id,
      blocked_id:partnerId
    });

    if (error) throw error;

    alert("已建立封鎖紀錄。建議接著離開聊天室。");

  } catch (e) {
    alert("封鎖失敗：" + e.message);
  }
};

/* 檢舉 */
$("report").onclick = async () => {
  $("menuDropdown").classList.add("hidden");

  if (!partnerId || !roomId) {
    alert("目前無法取得對方資料。");
    return;
  }

  const reason = prompt("請輸入檢舉原因：");
  if (!reason || !reason.trim()) return;

  try {
    const {error} = await db.from("reports").insert({
      reporter_id:user.id,
      reported_user_id:partnerId,
      room_id:roomId,
      reason:reason.trim(),
      details:""
    });

    if (error) throw error;

    alert("檢舉紀錄已送出。");

  } catch (e) {
    alert("檢舉失敗：" + e.message);
  }
};

initialize();
</script>
</body>
</html>
